# pnpm workspace + settings (pnpm v12 reads both from this file, not from package.json).
packages:
  - app

# Checkout de Windows: crear symlinks requiere admin o Developer Mode, y el
# linker aislado los necesita tanto para los paquetes como para el paquete
# workspace. `hoisted` materializa directorios reales y evita el problema.
# (El checkout de macOS es APFS y sí soporta symlinks; la restricción es Windows.)
# Al cambiar de linker, un node_modules existente queda con shims colgados que
# apuntan al layout anterior: purgalo antes de instalar (ver vercel.json).
nodeLinker: hoisted
verifyDepsBeforeRun: false

# esbuild ships a native binary and needs its postinstall script to finish the
# install. Everything else stays unapproved by default, so a new dependency with
# scripts fails the install instead of running code silently.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@ui-sdk/core@0.1.0-beta.13'
  - '@ui-sdk/react@0.1.0-beta.13'

permissions:
  '@ui-sdk/core':
    skills: true
